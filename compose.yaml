name: tradeledger
services:
  db:
    image: postgres:17-bookworm
    container_name: tradeledger-db
    labels:
      com.tradeledger.owner: tradeledger-local-stack-v1
    environment:
      POSTGRES_DB: tradeledger
      POSTGRES_USER: tradeledger_admin
      POSTGRES_PASSWORD: ${TRADELEDGER_DB_ADMIN_PASSWORD:?Use node scripts/local-stack.mjs db}
      TRADELEDGER_DB_APP_PASSWORD: ${TRADELEDGER_DB_APP_PASSWORD:?Use node scripts/local-stack.mjs db}
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tradeledger_admin -d tradeledger"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: tradeledger-api:local
    labels:
      com.tradeledger.owner: tradeledger-local-stack-v1
    environment:
      DATABASE_URL: ${TRADELEDGER_ADMIN_DATABASE_URL:?Use node scripts/local-stack.mjs up}
    command: [sh, -c, "npm run db:migrate && node scripts/post-migrate-grants.mjs"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    image: tradeledger-api:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: tradeledger-api
    labels:
      com.tradeledger.owner: tradeledger-local-stack-v1
    environment:
      DATABASE_URL: ${TRADELEDGER_APP_DATABASE_URL:?Use node scripts/local-stack.mjs up}
      PUBLIC_ORIGIN: http://127.0.0.1:5178
      HOST: 0.0.0.0
      PORT: "5180"
      NODE_ENV: development
    ports:
      - "127.0.0.1:5180:5180"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5180/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: tradeledger-web
    labels:
      com.tradeledger.owner: tradeledger-local-stack-v1
    ports:
      - "127.0.0.1:5178:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent --output /dev/null http://127.0.0.1/api/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  database:
    name: tradeledger-postgres-v1
    labels:
      com.tradeledger.owner: tradeledger-local-stack-v1
